<title>Red Line Kiosk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: black top bar under a red line, then one screen per role. Orders are tickets with a tear line. Brand: Red Line, red / white / black. */
:root{
  --bg:#F4F4F4; --surface:#FFFFFF; --surface-2:#EAEAEA; --ink:#0D0D0D; --muted:#5C5C5C; --line:#D9D9D9;
  --accent:#D7101C; --accent-ink:#FFFFFF; --accent-soft:#FBE2E3; --bar:#0D0D0D; --bar-ink:#FFFFFF;
  --ok:#22783F; --ok-soft:#DCEFE2; --warn:#965F0B; --warn-soft:#F7EAD0; --bad:#B3141F; --bad-soft:#F7DCDD; --info:#245A99; --info-soft:#DCE7F5;
  --shadow:0 1px 2px rgb(0 0 0 / .06), 0 4px 14px rgb(0 0 0 / .06);
  --font-display:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0A0A; --surface:#161616; --surface-2:#222222; --ink:#F2F2F2; --muted:#A3A3A3; --line:#2D2D2D;
  --accent:#EF2B37; --accent-ink:#FFFFFF; --accent-soft:#3A1215; --bar:#000000; --bar-ink:#FFFFFF;
  --ok:#5CC27E; --ok-soft:#153021; --warn:#E5B04E; --warn-soft:#382B12; --bad:#FF6B73; --bad-soft:#3D1618; --info:#7AABE8; --info-soft:#15273C;
  --shadow:0 1px 2px rgb(0 0 0 / .5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#161616; --surface-2:#222222; --ink:#F2F2F2; --muted:#A3A3A3; --line:#2D2D2D;
  --accent:#EF2B37; --accent-ink:#FFFFFF; --accent-soft:#3A1215; --bar:#000000; --bar-ink:#FFFFFF;
  --ok:#5CC27E; --ok-soft:#153021; --warn:#E5B04E; --warn-soft:#382B12; --bad:#FF6B73; --bad-soft:#3D1618; --info:#7AABE8; --info-soft:#15273C;
  --shadow:0 1px 2px rgb(0 0 0 / .5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);letter-spacing:.01em;text-wrap:balance;margin:0}
h1,h2{text-transform:uppercase}
h1{font-size:clamp(38px,8vw,60px);font-weight:800;line-height:.95}
h2{font-size:26px;font-weight:700}
h3{font-size:16px;font-weight:600;font-family:var(--font-body);letter-spacing:0}
p{margin:0}
button{font:inherit;color:inherit}
.mono,.price,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);border-bottom:4px solid var(--accent)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:4px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand-mark svg{width:17px;height:17px}
.proto{font:600 11px var(--font-body);color:var(--bar-ink);background:rgb(255 255 255 / .14);text-transform:none;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.roles{display:flex;background:rgb(255 255 255 / .1);border-radius:999px;padding:3px;margin-left:auto}
.roles button{border:0;background:transparent;color:rgb(255 255 255 / .72);font-weight:600;font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer}
.roles button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
.bell{position:relative;border:1px solid rgb(255 255 255 / .25);background:transparent;color:var(--bar-ink);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.bell svg{width:18px;height:18px}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:700 11px/18px var(--font-body);text-align:center}
.notes{color:var(--ink);position:absolute;right:16px;top:calc(100% + 6px);width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:25}
.notes-in{position:relative;max-width:1180px;margin:0 auto}
.note{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 14px;cursor:pointer}
.note:last-child{border-bottom:0}
.note.unread{background:var(--accent-soft)}
.note .t{font-size:12px;color:var(--muted)}

main.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 130px}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;padding:8px 14px;border-radius:10px;cursor:pointer;min-height:40px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.err{color:var(--bad);font-size:13px;font-weight:600}
.toggle{border:0;background:var(--surface-2);width:44px;height:26px;border-radius:999px;position:relative;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--ok)}
.toggle[aria-pressed="true"]::after{left:21px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-new{background:var(--warn-soft);color:var(--warn)}
.s-sent{background:var(--info-soft);color:var(--info)}
.s-accepted,.s-picked{background:var(--accent-soft);color:var(--accent)}
.s-delivered{background:var(--ok-soft);color:var(--ok)}
.s-cancelled{background:var(--surface-2);color:var(--muted)}
.tag{display:inline-flex;align-items:center;font:600 12px var(--font-mono);padding:2px 8px;border-radius:6px;border:1px dashed var(--accent);color:var(--accent)}
.tag.plain{border-style:solid;border-color:var(--line);color:var(--muted);font-family:var(--font-body)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* customer */
.shop-hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}
.shop-hero .stack{gap:8px;max-width:640px}
.dealstrip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.deal-chip{flex:none;display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.deal-chip b{font-family:var(--font-mono);font-size:13px;color:var(--accent);letter-spacing:.04em}
.catnav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-bottom:6px}
.catnav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer}
.cat-h{margin:22px 0 12px;font-size:20px;scroll-margin-top:80px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item p{color:var(--muted);font-size:14px;flex:1}
.item .price{font-weight:700}
.item-act{display:flex;justify-content:flex-end;margin-top:6px}
.item.off{opacity:.55}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:transparent;width:34px;height:32px;font-size:18px;font-weight:600;cursor:pointer;color:var(--accent)}
.stepper span{min-width:26px;text-align:center;font-family:var(--font-mono);font-weight:700}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.cartbar .btn{pointer-events:auto;width:min(520px,100%);min-height:54px;font-size:16px;border-radius:14px;box-shadow:0 8px 24px rgb(215 16 28 / .3);justify-content:space-between;padding:0 18px}
.track-card{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:10px;align-items:center}
.line .nm{flex:1;min-width:0}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.totals .grand{font-size:18px;font-weight:700;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.totals .disc{color:var(--ok)}
.item.deal{border:1.5px solid var(--accent)}
.later{border-style:dashed;background:transparent}
.cash{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:4px 10px;font-size:14px}
.cash .mono{font-weight:700}
.save{color:var(--ok);font-weight:700;font-size:13px}
.save s{color:var(--muted);font-weight:500;margin-left:4px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.pickrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--surface)}
.pickrow input{width:72px;flex:none}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:24px 1fr;gap:12px;position:relative;padding-bottom:18px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:11px;top:22px;bottom:-2px;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .b{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;z-index:1}
.step.done .b{background:var(--ok);border-color:var(--ok)}
.step.done .b::after{content:"";width:8px;height:5px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.step.done::before{background:var(--ok)}
.step.now .b{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.step.now .b::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.step .lbl{font-weight:600}
.step:not(.done):not(.now) .lbl{color:var(--muted)}
.eta-big{font:700 30px var(--font-mono);color:var(--accent)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgb(10 16 12 / .5);z-index:40;display:flex;justify-content:flex-end}
.sheet{width:min(580px,100%);height:100%;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;align-items:center;gap:10px}
.x{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.x svg{width:16px;height:16px}

/* chat */
.thread{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto;padding:12px;background:var(--surface-2);border-radius:12px}
.msg{max-width:85%;padding:8px 11px;border-radius:12px 12px 12px 4px;background:var(--surface);border:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent;border-radius:12px 12px 4px 12px}
.msg .who{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px}
.chatform{display:flex;gap:8px;margin-top:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 12px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .c{font-family:var(--font-mono);font-size:12px;margin-left:5px;padding:1px 6px;border-radius:999px;background:var(--surface-2)}

/* moderator */
.mod{display:grid;grid-template-columns:190px minmax(0,1fr);gap:24px;align-items:start}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:76px}
.side button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600;cursor:pointer;color:var(--muted)}
.side button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.side .c{font:700 12px var(--font-mono);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--shadow);text-align:left;min-width:0}
.ticket:hover{border-color:var(--muted)}
.ticket[data-s="new"]{box-shadow:inset 4px 0 0 var(--warn),var(--shadow)}
.ticket[data-s="sent"]{box-shadow:inset 4px 0 0 var(--info),var(--shadow)}
.ticket[data-s="accepted"],.ticket[data-s="picked"]{box-shadow:inset 4px 0 0 var(--accent),var(--shadow)}
.ticket[data-s="delivered"]{box-shadow:inset 4px 0 0 var(--ok),var(--shadow)}
.ticket[data-s="cancelled"]{box-shadow:inset 4px 0 0 var(--muted),var(--shadow);opacity:.8}
.t-top{padding:14px 16px 12px;display:grid;gap:6px}
.t-no{font:700 20px var(--font-mono);letter-spacing:-.01em}
.tear{position:relative;border-top:2px dashed var(--line);margin:0 16px}
.tear::before,.tear::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.tear::before{left:-26px} .tear::after{right:-26px}
.t-items{padding:12px 16px;font-size:14px;display:grid;gap:3px}
.t-items .q{font-family:var(--font-mono);color:var(--muted);margin-right:6px}
.t-foot{padding:10px 16px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.t-foot .tot{font:700 16px var(--font-mono);color:var(--ink);margin-left:auto}
.ic{display:inline-flex;align-items:center;gap:4px}
.ic svg{width:14px;height:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .l{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font:700 22px var(--font-mono);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.hl{background:var(--accent);border-color:var(--accent)}
.kpi.hl .l,.kpi.hl .v{color:var(--accent-ink)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;background:var(--surface-2)}
td,th{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--font-mono)}
td input{min-width:90px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.hist{font-size:13px;color:var(--muted);display:grid;gap:2px}
textarea.csv{font:12px/1.5 var(--font-mono);min-height:160px}

/* driver */
.etas{display:flex;gap:6px;flex-wrap:wrap}
.etas label{cursor:pointer}
.etas input{position:absolute;opacity:0;width:1px;height:1px}
.etas span{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font:700 14px var(--font-mono);background:var(--surface)}
.etas input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.etas input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.job{border-left:4px solid var(--accent)}
.job.offer{border-left-color:var(--info)}

/* toasts */
#toasts{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;box-shadow:0 10px 30px rgb(0 0 0 / .25);font-size:14px;font-weight:500;display:flex;gap:10px;align-items:flex-start;animation:tin .25s ease-out}
.toast b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

@media (max-width:780px){
  .mod{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{flex-direction:row;overflow-x:auto;position:static}
  .side button{flex:none}
  .roles{margin-left:0;order:3;width:100%}
  .roles button{flex:1}
}
</style>

<div id="app"></div>
<div id="toasts" aria-live="polite"></div>

<script>
(() => {
const KEY = 'redline-kiosk-proto-v1', LOCAL = 'redline-kiosk-local-v1';
const MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;
const now = () => Date.now();

/* ---------- money & deals ---------- */
const money = n => '£' + (Math.round(n * 100) / 100).toFixed(2);
const neg = n => n > 0.004 ? '−' + money(n) : '—';
const cap = t => t[0].toUpperCase() + t.slice(1);
const dealLive = d => d && d.active && (!d.expires || d.expires > now());
const reward = d => d.type === 'percent' ? `${d.value}% off` : d.type === 'fixed' ? `${money(d.value)} off` : 'free delivery';
const contents = (d, menu = S.menu) => d.items.map(x => `${x.qty}× ${menu.find(m => m.id === x.id)?.name || 'removed item'}`).join(' + ');
const regular = (d, menu = S.menu) => d.items.reduce((a, x) => a + (menu.find(m => m.id === x.id)?.price || 0) * x.qty, 0);
const bundleOk = d => dealLive(d) && d.items.every(x => S.menu.find(m => m.id === x.id)?.on);
const dealTitle = d => d.kind === 'bundle' ? d.name : d.kind === 'spend' ? `Spend ${money(d.min)}, get ${reward(d)}` : d.code;
const dealDetail = d => d.kind === 'bundle' ? `${contents(d)} for ${money(d.price)}` : d.kind === 'code' ? cap(reward(d)) + (d.min > 0 ? ` when you spend ${money(d.min)}` : '') : 'Added automatically at checkout';
const until = d => d.expires ? ` · until ${hhmm(d.expires)}` : '';
function bundleLine(d, qty, menu = S.menu) { const reg = regular(d, menu); return {id:'b:' + d.id, name:d.name, contents:contents(d, menu), price:d.price, qty, bundle:true, save:Math.max(0, Math.round((reg - d.price) * 100) / 100)}; }
const dealValue = (d, sub, fee) => d.type === 'percent' ? sub * d.value / 100 : d.type === 'fixed' ? d.value : fee;
// One money-off deal per order: the best of any live spend deal the basket qualifies for and the promo code entered.
// Meal deals are separate: their saving is already in the bundle price.
function totals(items, code, st = S) {
  const sub = items.reduce((a, i) => a + i.price * i.qty, 0);
  const fee = items.length ? +st.settings.deliveryFee : 0;
  const cd = code ? st.deals.find(x => x.kind === 'code' && x.code === code) : null;
  const options = st.deals.filter(d => d.kind === 'spend' && dealLive(d));
  if (dealLive(cd)) options.push(cd);
  let best = null, disc = 0;
  options.filter(d => sub > 0 && sub >= (d.min || 0)).forEach(d => { const v = Math.min(dealValue(d, sub, fee), sub + fee); if (v > disc) { disc = v; best = d; } });
  disc = Math.round(disc * 100) / 100;
  const next = st.deals.filter(d => d.kind === 'spend' && dealLive(d) && sub > 0 && sub < d.min && (!best || d.min > (best.min || 0))).sort((a, b) => a.min - b.min)[0];
  return {sub, fee, disc, total:Math.round((sub + fee - disc) * 100) / 100, best, deal:best ? (best.kind === 'code' ? best.code : dealTitle(best)) : null,
    codeShort:cd && sub < cd.min ? cd.min - sub : 0, next, save:items.reduce((a, i) => a + (i.save || 0) * i.qty, 0)};
}
function buildOrder(st, customer, items, code, at) {
  const t = totals(items, code, st);
  return {id:uid('o'), no:st.nextNo++, at, customer, items, sub:t.sub, fee:t.fee, disc:t.disc, total:t.total, deal:t.deal, dealId:t.best?.id || null, save:t.save,
    status:'new', driverId:null, eta:null, etaMin:null, driverNote:'',
    history:[{s:'new', at}], threads:{customer:[], driver:[]}};
}
const iname = i => esc(i.name) + (i.contents ? `<div class="muted small">${esc(i.contents)}</div>` : '');

const h = location.hash.replace('#', '');
if (['order','customer'].includes(h)) L.role = 'customer';
if (h === 'driver') L.role = 'driver';
if (['admin','moderator'].includes(h)) L.role = 'mod';
let seen = new Set(S.notes.map(n => n.id));

function save() { lsSet(KEY, S); }
function saveLocal() { lsSet(LOCAL, L); }
function notify(to, text, order) { const n = {id:uid('n'), at:now(), to, text, order}; S.notes.push(n); if (S.notes.length > 300) S.notes.shift(); seen.add(n.id); }
const audience = () => L.role === 'mod' ? ['mod'] : L.role === 'driver' ? ['driver:' + L.driverId] : L.myOrders.map(id => 'order:' + id);
const myNotes = () => { const a = audience(); return S.notes.filter(n => a.includes(n.to)); };
const audKey = () => L.role === 'driver' ? 'driver:' + L.driverId : L.role;
const unread = () => myNotes().filter(n => n.at > (L.read[audKey()] || 0)).length;
const order = id => S.orders.find(o => o.id === id);
const driver = id => S.drivers.find(d => d.id === id);

window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  try { S = JSON.parse(e.newValue); } catch { return; }
  const a = audience();
  S.notes.filter(n => !seen.has(n.id)).forEach(n => { seen.add(n.id); if (a.includes(n.to)) toast(n.text); });
  render();
});

/* ---------- formatting ---------- */
const hhmm = t => new Date(t).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
function ago(t) { const m = Math.round((now() - t) / MIN); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; if (m < 1440) return Math.floor(m / 60) + ' h ago'; return new Date(t).toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'}); }
function etaText(o) { if (!o.eta) return ''; const m = Math.round((o.eta - now()) / MIN); return `${hhmm(o.eta)} · ${m > 0 ? 'in ' + m + ' min' : 'due now'}`; }
const LABEL = {new:'New', sent:'Sent to driver', accepted:'Accepted', picked:'Out for delivery', delivered:'Completed', cancelled:'Cancelled'};
const CLABEL = {new:'Order received', sent:'Being prepared', accepted:'Driver assigned', picked:'On the way', delivered:'Delivered', cancelled:'Cancelled'};
const pill = (s, cust) => `<span class="pill s-${s}">${(cust ? CLABEL : LABEL)[s]}</span>`;
const itemCount = o => o.items.reduce((a, i) => a + i.qty, 0);
const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* ---------- toasts ---------- */
function toast(text, title = 'Update') {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div><b>${esc(title)}</b>${esc(text)}</div>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 4800);
}

/* ---------- render ---------- */
const app = document.getElementById('app');
let clearIds = [];
function render() {
  // keep what people are typing across re-renders
  const vals = {}, act = document.activeElement, focusId = act && act.id, sel = act && 'selectionStart' in act ? [act.selectionStart, act.selectionEnd] : null;
  app.querySelectorAll('input[id],textarea[id],select[id]').forEach(el => { vals[el.id] = el.type === 'checkbox' || el.type === 'radio' ? el.checked : el.value; });
  clearIds.forEach(id => delete vals[id]); clearIds = [];
  app.innerHTML = vTop() + `<main class="wrap">${L.role === 'customer' ? vCustomer() : L.role === 'mod' ? vMod() : vDriver()}</main>` + (ui.open && L.role === 'mod' ? vOrderSheet(order(ui.open)) : '');
  Object.entries(vals).forEach(([id, v]) => { const el = document.getElementById(id); if (!el) return; if (el.type === 'checkbox' || el.type === 'radio') el.checked = v; else el.value = v; });
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus({preventScroll:true}); if (sel && el.setSelectionRange) try { el.setSelectionRange(...sel); } catch {} } }
  app.querySelectorAll('.thread').forEach(t => t.scrollTop = t.scrollHeight);
}

      ${[['customer','Customer'],['mod','Moderator'],['driver','Driver']].map(([k, l]) => `<button data-act="role" data-v="${k}" aria-pressed="${L.role === k}">${l}</button>`).join('')}
    </div>
    <button class="bell" data-act="bell" aria-label="Notifications${u ? ', ' + u + ' unread' : ''}">${ICON.bell}${u ? `<span class="badge">${u}</span>` : ''}</button>
  </div>
  ${ui.showNotes ? `<div class="notes-in"><div class="notes">${notes.length ? notes.map(n => `<button class="note ${n.at > lr ? 'unread' : ''}" data-act="note" data-id="${n.order || ''}"><div>${esc(n.text)}</div><div class="t">${ago(n.at)}</div></button>`).join('') : '<div class="empty" style="border:0">No notifications yet.</div>'}</div></div>` : ''}

}

/* ---------- customer ---------- */
function cartItems() {
  return Object.entries(ui.cart).filter(([, q]) => q > 0).map(([id, qty]) => {
    if (id.startsWith('b:')) { const d = S.deals.find(x => x.id === id.slice(2)); return d && bundleOk(d) ? bundleLine(d, qty) : null; }
    const m = S.menu.find(x => x.id === id); return m && m.on ? {id, name:m.name, price:m.price, qty} : null;
  }).filter(Boolean);
}
const stepper = (id, q) => `<span class="stepper"><button data-act="dec" data-id="${id}" aria-label="Remove one">−</button><span>${q}</span><button data-act="inc" data-id="${id}" aria-label="Add one">+</button></span>`;

  const hasDeals = bundles.length || spends.length;

  <section class="shop-hero"><div class="stack">

    <div class="item-top"><h3>${esc(d.name)}</h3><span class="price">${money(d.price)}</span></div><p>${esc(contents(d))}</p>
    <div class="item-act" style="justify-content:space-between;align-items:center">${reg > d.price ? `<span class="save">Save ${money(reg - d.price)}<s>${money(reg)}</s></span>` : '<span></span>'}${q ? stepper(id, q) : `<button class="btn sm primary" data-act="inc" data-id="${id}">Add</button>`}</div></article>`; }).join('')}</div>` : ''}` : ''}
  ${cats.map(c => `<h2 class="cat-h" id="cat-${esc(c).replace(/\W/g, '')}">${esc(c)}</h2><div class="menu-grid">${S.menu.filter(m => m.cat === c).map(m => {

    return `<article class="item ${m.on ? '' : 'off'}"><div class="item-top"><h3>${esc(m.name)}</h3><span class="price">${money(m.price)}</span></div><p>${esc(m.desc)}</p>

function vBasket(items, t) {

const STEPS = ['new', 'sent', 'accepted', 'picked', 'delivered'];
function vTrack(o) {
  const ri = STEPS.indexOf(o.status), d = driver(o.driverId);
  const when = s => { const h = o.history.filter(x => x.s === s).pop(); return h ? hhmm(h.at) : ''; };
  return `<div class="stack" style="max-width:640px;margin:0 auto;gap:16px">
    <div><button class="btn ghost sm" data-act="menu">${ICON.back} Back to menu</button></div>
    <div class="row" style="align-items:flex-end"><div class="stack" style="gap:4px"><span class="eyebrow">Order</span><h1 class="mono" style="font-family:var(--font-mono)">#${o.no}</h1></div><span class="spacer"></span>${pill(o.status, true)}</div>
    ${o.status === 'cancelled' ? `<div class="panel" style="background:var(--bad-soft);border-color:transparent"><strong>This order was cancelled.</strong> Message the shop below if you have questions.</div>` : `
    <div class="panel">
      ${['accepted','picked'].includes(o.status) && o.eta ? `<div class="stack" style="gap:2px;margin-bottom:16px"><span class="eyebrow">Arriving</span><span class="eta-big" data-eta="${o.id}">${etaText(o)}</span><span class="muted small">${d ? esc(d.name) + ' is delivering your order' : ''}</span></div>` : ''}
      <ol class="steps">${STEPS.map((s, i) => `<li class="step ${i < ri || o.status === 'delivered' ? 'done' : i === ri ? 'now' : ''}"><span class="b"></span><div><div class="lbl">${CLABEL[s]}</div><div class="muted small">${when(s)}</div></div></li>`).join('')}</ol>
    </div>`}
    <div class="panel"><div class="panel-h"><h3>Messages with ${esc(S.settings.shop)}</h3></div>${vThread(o, 'customer', 'customer')}</div>
    <div class="panel stack"><h3>Your order</h3>
      <div class="lines">${o.items.map(i => `<div class="line"><span class="mono muted">${i.qty}×</span><span class="nm">${iname(i)}</span><span class="mono">${money(i.price * i.qty)}</span></div>`).join('')}</div>
      ${vTotals(o)}
      <p class="cash">Pay <span class="mono">${money(o.total)}</span> cash to your driver</p>
      <p class="muted small">Delivering to ${esc(o.customer.address)}</p>
    </div>
  </div>`;
}
const vTotals = o => `<div class="totals"><span>Subtotal</span><span class="mono">${money(o.sub)}</span><span>Delivery</span><span class="mono">${money(o.fee)}</span>${o.disc ? `<span class="disc">${esc(o.deal)}</span><span class="mono disc">−${money(o.disc)}</span>` : ''}<span class="grand">Total</span><span class="grand mono">${money(o.total)}</span></div>`;

function vThread(o, thread, me) {
  const who = m => m.from === 'customer' ? o.customer.name : m.from === 'shop' ? S.settings.shop : (driver(o.driverId)?.name || 'Driver');
  const msgs = o.threads[thread];
  return `<div class="thread">${msgs.length ? msgs.map(m => `<div class="msg ${m.from === me ? 'me' : ''}"><div class="who">${esc(who(m))} · ${hhmm(m.at)}</div>${esc(m.text)}</div>`).join('') : '<p class="muted small" style="text-align:center">No messages yet.</p>'}</div>
  <form class="chatform" data-form="msg" data-id="${o.id}" data-thread="${thread}" data-from="${me}"><input id="msg-${o.id}-${thread}-${me}" name="t" placeholder="Write a message" autocomplete="off"><button class="btn primary">Send</button></form>`;
}

/* ---------- moderator ---------- */
const FILTERS = {new:['new'], sent:['sent'], way:['accepted','picked'], done:['delivered'], cancelled:['cancelled'], all:null};
const FLABEL = {new:'New', sent:'Sent to driver', way:'On the way', done:'Completed', cancelled:'Cancelled', all:'All'};
function vMod() {
  const nNew = S.orders.filter(o => o.status === 'new').length;
  const tabs = [['orders','Orders', nNew], ['menu','Menu'], ['deals','Deals'], ['drivers','Drivers'], ['accounts','Accounts'], ['settings','Settings']];
  const body = {orders:vOrders, menu:vMenu, deals:vDeals, drivers:vDrivers, accounts:vAccounts, settings:vSettings}[ui.modTab]();
  return `<div class="mod"><nav class="side" aria-label="Moderator sections">${tabs.map(([k, l, c]) => `<button data-act="modtab" data-v="${k}" aria-current="${ui.modTab === k}"><span>${l}</span>${c ? `<span class="c">${c}</span>` : ''}</button>`).join('')}</nav><section style="min-width:0">${body}</section></div>`;
}
function vOrders() {
  const f = FILTERS[ui.filter];
  let list = S.orders.filter(o => !f || f.includes(o.status));
  list.sort((a, b) => ui.filter === 'new' ? a.at - b.at : b.at - a.at);
  const count = k => S.orders.filter(o => !FILTERS[k] || FILTERS[k].includes(o.status)).length;
  return `<div class="panel-h"><h2>Orders</h2><span class="spacer"></span><span class="muted small">Tap a ticket to open it</span></div>
  <div class="tabs" role="tablist">${Object.keys(FILTERS).map(k => `<button role="tab" data-act="filter" data-v="${k}" aria-selected="${ui.filter === k}">${FLABEL[k]}<span class="c">${count(k)}</span></button>`).join('')}</div>
  ${list.length ? `<div class="board">${list.map(vTicket).join('')}</div>` : `<div class="empty">Nothing in ${FLABEL[ui.filter].toLowerCase()} right now.</div>`}`;
}
function vTicket(o) {

  </article>`;
}
function vOrderSheet(o) {
  if (!o) return '';
  const d = driver(o.driverId), onDuty = S.drivers.filter(x => x.on);
  const open = !['delivered','cancelled'].includes(o.status);
  return `<div class="sheet-bg" data-act="close"><div class="sheet" data-act="noop" role="dialog" aria-label="Order ${o.no}">
    <div class="sheet-h"><span class="t-no">#${o.no}</span>${pill(o.status)}<span class="spacer"></span><button class="x" data-act="close" aria-label="Close">${ICON.x}</button></div>
    <div class="panel"><dl class="kv"><dt>Customer</dt><dd><strong>${esc(o.customer.name)}</strong></dd><dt>Phone</dt><dd class="mono">${esc(o.customer.phone)}</dd><dt>Address</dt><dd>${esc(o.customer.address)}</dd><dt>Placed</dt><dd>${hhmm(o.at)} · ${ago(o.at)}</dd><dt>Payment</dt><dd>Cash on delivery · <strong class="mono">${money(o.total)}</strong></dd>${o.customer.note ? `<dt>Comment</dt><dd>“${esc(o.customer.note)}”</dd>` : ''}</dl></div>
    <div class="panel stack"><div class="lines">${o.items.map(i => `<div class="line"><span class="mono muted">${i.qty}×</span><span class="nm">${iname(i)}</span><span class="mono">${money(i.price * i.qty)}</span></div>`).join('')}</div>${vTotals(o)}</div>

    ${o.status === 'new' ? `<form class="panel stack" data-form="dispatch" data-id="${o.id}"><h3>Send ticket to a driver</h3>
      ${onDuty.length ? `<label class="f">Driver<select id="drv-${o.id}" name="driver">${onDuty.map(x => `<option value="${x.id}">${esc(x.name)} · ${S.orders.filter(q => q.driverId === x.id && ['sent','accepted','picked'].includes(q.status)).length} active</option>`).join('')}</select></label>
      <label class="f">Note for the driver<textarea id="dnote-${o.id}" name="note" placeholder="Gate code, parking, collect cash…"></textarea></label>
      <button class="btn primary block">Send ticket</button>` : `<div class="empty">No drivers on duty. Turn one on in Drivers.</div>`}</form>` : ''}
    ${o.status === 'sent' ? `<div class="panel row"><span class="ic">${ICON.car}</span><span>Waiting for <strong>${esc(d?.name)}</strong> to accept</span><span class="spacer"></span><button class="btn sm" data-act="reassign" data-id="${o.id}">Reassign</button></div>` : ''}
    ${['accepted','picked'].includes(o.status) ? `<div class="panel row"><span class="ic">${ICON.car}</span><span><strong>${esc(d?.name)}</strong> · ETA <span class="mono" data-eta="${o.id}">${etaText(o)}</span></span></div>` : ''}
    ${open ? `<div class="row">${o.status !== 'new' ? `<button class="btn ok" data-act="setstatus" data-v="delivered" data-id="${o.id}">Mark completed</button>` : ''}
      ${ui.confirmCancel ? `<span class="small">Cancel this order?</span><button class="btn danger" data-act="cancel" data-id="${o.id}">Yes, cancel</button><button class="btn ghost" data-act="nocancel">Keep it</button>` : `<button class="btn danger" data-act="askcancel">Cancel order</button>`}</div>` : ''}

    <div class="panel"><div class="tabs" role="tablist">
      <button role="tab" data-act="thread" data-v="customer" aria-selected="${ui.thread === 'customer'}">Customer<span class="c">${o.threads.customer.length}</span></button>
      <button role="tab" data-act="thread" data-v="driver" aria-selected="${ui.thread === 'driver'}" ${d ? '' : 'disabled'}>Driver${d ? ' · ' + esc(d.name) : ''}<span class="c">${o.threads.driver.length}</span></button></div>
      ${ui.thread === 'driver' && !d ? '<p class="muted small">Send the ticket to a driver first.</p>' : vThread(o, ui.thread === 'driver' && d ? 'driver' : 'customer', 'shop')}
      ${o.driverNote ? `<p class="muted small" style="margin-top:8px">Ticket note: “${esc(o.driverNote)}”</p>` : ''}</div>
    <div class="panel"><h3 style="margin-bottom:8px">History</h3><div class="hist">${o.history.map(x => `<div><span class="mono">${hhmm(x.at)}</span> · ${LABEL[x.s]}${x.by ? ' · ' + esc(x.by) : ''}</div>`).join('')}</div></div>
  </div></div>`;
}
function vMenu() {

  <div class="tbl"><table><thead><tr><th>Item</th><th>Section</th><th class="num">Price</th><th>Available</th><th></th></tr></thead><tbody>

const KIND = {bundle:'Meal deal', spend:'Spend deal', code:'Promo code'};
const KINDS = {bundle:'Meal deals', spend:'Spend deals', code:'Promo codes'};
const KHELP = {bundle:'Pick items and set one price. Shows at the top of the menu with an Add button.',
  spend:'Customers who spend enough get money off. Applied automatically, no code needed.',
  code:'A code you give out yourself. Customers type it in their basket.'};
function vDeals() {
  const live = S.orders.filter(o => o.status !== 'cancelled');
  const stats = d => {
    if (d.kind === 'bundle') { let n = 0, sv = 0; live.forEach(o => o.items.forEach(i => { if (i.id === 'b:' + d.id) { n += i.qty; sv += (i.save || 0) * i.qty; } })); return [n, sv]; }
    const l = live.filter(o => o.dealId === d.id); return [l.length, l.reduce((a, o) => a + o.disc, 0)];
  };
  const card = d => { const [n, sv] = stats(d), on = dealLive(d); return `<div class="card">
    <div class="row"><span class="pill ${on ? 's-delivered' : 's-cancelled'}">${on ? 'Live' : d.active ? 'Ended' : 'Off'}</span><span class="spacer"></span><button class="toggle" data-act="dealtoggle" data-id="${d.id}" aria-pressed="${d.active}" aria-label="${esc(dealTitle(d))} on"></button></div>
    <strong style="font-size:16px">${d.kind === 'code' ? `<span class="tag">${esc(d.code)}</span>` : esc(dealTitle(d))}</strong>
    <div class="small">${esc(dealDetail(d))}${d.kind === 'bundle' ? ` <span class="muted">(normally ${money(regular(d))})</span>` : ''}</div>
    ${d.kind === 'bundle' && d.price >= regular(d) ? '<div class="err">This costs the same or more than buying the items separately.</div>' : ''}
    <div class="muted small">${d.expires ? (d.expires > now() ? 'Ends ' + hhmm(d.expires) + ', ' + new Date(d.expires).toLocaleDateString([], {day:'numeric', month:'short'}) : 'Ended') : 'Runs until you turn it off'} · used ${n}× · customers saved ${money(sv)}</div>
    <div><button class="btn sm ghost danger" data-act="dealdel" data-id="${d.id}">Delete</button></div></div>`; };
  const k = ui.dealKind;
  const rewardFields = `<label class="f">Reward<select id="da-type" name="type"><option value="fixed">Amount off (£)</option><option value="percent">% off</option><option value="freedelivery">Free delivery</option></select></label>
      <label class="f">Amount off<input id="da-val" name="value" type="number" min="0" step="0.5" placeholder="5"></label>`;
  const exp = `<label class="f">Ends in (hours, optional)<input id="da-exp" name="exp" type="number" min="0" step="1" placeholder="No end"></label>`;
  return `<div class="panel-h"><h2>Deals</h2><span class="spacer"></span><span class="muted small">Switch any deal on or off whenever you like. Customers see it straight away.</span></div>
  <div class="stack" style="gap:18px">
  ${Object.keys(KINDS).map(kind => { const list = S.deals.filter(d => d.kind === kind); return list.length ? `<div><h3 style="margin-bottom:8px">${KINDS[kind]}</h3><div class="cards">${list.map(card).join('')}</div></div>` : ''; }).join('')}
  <div><h3 style="margin-bottom:8px">Coming later</h3><div class="cards">
    <div class="card later"><span class="tag plain">Coming later</span><strong style="font-size:16px">Loyalty deals</strong><div class="small muted">Reward regulars, for example every 5th order gets £5 off. Customers are matched by phone number. Ask to switch this on when you want it.</div></div>
    <div class="card later"><span class="tag plain">Coming later</span><strong style="font-size:16px">Mystery deal spin</strong><div class="small muted">Customers spin at checkout and win one deal from a pool you pick.</div></div>
  </div></div>
  <form class="panel stack" data-form="dealadd"><h3>Create a deal</h3>
    <div class="seg" role="group" aria-label="Deal type">${Object.entries(KIND).map(([v, l]) => `<button type="button" data-act="dealkind" data-v="${v}" aria-pressed="${k === v}">${l}</button>`).join('')}</div>
    <p class="muted small">${KHELP[k]}</p>
    ${k === 'bundle' ? `<div class="grid2"><label class="f">Deal name<input id="da-name" name="name" placeholder="Family feast"></label><label class="f">Deal price<input id="da-price" name="price" type="number" min="0" step="0.05" placeholder="25"></label>${exp}</div>
      <div class="stack" style="gap:8px"><span class="eyebrow">How many of each item</span><div class="pick">${S.menu.map(m => `<label class="pickrow"><span>${esc(m.name)} <span class="muted mono small">${money(m.price)}</span></span><input id="bq-${m.id}" name="q_${m.id}" type="number" min="0" step="1" placeholder="0" aria-label="How many ${esc(m.name)}"></label>`).join('')}</div></div>`
    : k === 'spend' ? `<div class="grid2"><label class="f">Customer spends at least<input id="da-min" name="min" type="number" min="0" step="0.5" placeholder="30"></label>${rewardFields}${exp}</div>`
    : `<div class="grid2"><label class="f">Code<input id="da-code" name="code" placeholder="SUMMER20" style="text-transform:uppercase"></label>${rewardFields}<label class="f">Minimum spend (optional)<input id="da-min" name="min" type="number" min="0" step="0.5" placeholder="0"></label>${exp}</div>`}
    <div><button class="btn primary">Create and switch on</button></div></form>
  </div>`;
}
function vDrivers() {

  <div class="cards">${S.drivers.map(d => { const mine = S.orders.filter(o => o.driverId === d.id); const act = mine.filter(o => ['sent','accepted','picked'].includes(o.status)).length; const done = mine.filter(o => o.status === 'delivered'); return `<div class="card">

    <div><button class="btn sm" data-act="viewas" data-id="${d.id}">Open driver view</button></div></div>`; }).join('')}</div>
  <form class="panel stack" data-form="drvadd" style="margin-top:16px"><h3>Add a driver</h3>

    <div><button class="btn primary">Add driver</button></div></form>`;

function vAccounts() {
  const ranges = {today:['Today', dayStart()], '7d':['7 days', now() - 7 * DAY], '30d':['30 days', now() - 30 * DAY], all:['All time', 0]};
  const from = ranges[ui.acct][1];
  const done = S.orders.filter(o => o.status === 'delivered' && o.at >= from);
  const sum = (arr, k) => arr.reduce((a, o) => a + (o[k] || 0), 0);
  const sales = sum(done, 'sub'), disc = sum(done, 'disc'), fees = sum(done, 'fee'), take = sum(done, 'total');
  const days = {}; done.forEach(o => { (days[dayKey(o.at)] ||= []).push(o); });
  const dRows = Object.keys(days).sort().reverse();
  const byDrv = S.drivers.map(d => ({d, list:done.filter(o => o.driverId === d.id)})).filter(x => x.list.length);
  const byDeal = {}; const addDeal = (k, n, sv) => { const r = byDeal[k] ||= {n:0, sv:0}; r.n += n; r.sv += sv; };
  done.forEach(o => { if (o.deal && o.disc) addDeal(o.deal, 1, o.disc); o.items.forEach(i => { if (i.bundle) addDeal(i.name, i.qty, (i.save || 0) * i.qty); }); });
  const cancelled = S.orders.filter(o => o.status === 'cancelled' && o.at >= from).length;
  return `<div class="panel-h"><h2>Accounts</h2><span class="spacer"></span><div class="seg">${Object.entries(ranges).map(([k, [l]]) => `<button data-act="acct" data-v="${k}" aria-pressed="${ui.acct === k}">${l}</button>`).join('')}</div></div>
  <div class="kpis">
    <div class="kpi"><div class="l">Orders</div><div class="v">${done.length}</div></div>
    <div class="kpi"><div class="l">Food sales</div><div class="v">${money(sales)}</div></div>
    <div class="kpi"><div class="l">Delivery fees</div><div class="v">${money(fees)}</div></div>
    <div class="kpi"><div class="l">Discounts</div><div class="v">${neg(disc)}</div></div>
    <div class="kpi hl"><div class="l">Takings</div><div class="v">${money(take)}</div></div>
    <div class="kpi"><div class="l">Average order</div><div class="v">${money(done.length ? take / done.length : 0)}</div></div>
  </div>
  <p class="muted small" style="margin:-6px 0 16px">Completed orders only. ${cancelled} cancelled in this period, not counted.</p>
  <div class="stack" style="gap:18px">
  <div><h3 style="margin-bottom:8px">By day</h3><div class="tbl"><table><thead><tr><th>Day</th><th class="num">Orders</th><th class="num">Sales</th><th class="num">Fees</th><th class="num">Discounts</th><th class="num">Takings</th></tr></thead><tbody>
    ${dRows.length ? dRows.map(k => { const l = days[k]; const t = sum(l, 'total'); return `<tr><td>${new Date(l[0].at).toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'})}</td><td class="num">${l.length}</td><td class="num">${money(sum(l, 'sub'))}</td><td class="num">${money(sum(l, 'fee'))}</td><td class="num">${neg(sum(l, 'disc'))}</td><td class="num"><strong>${money(t)}</strong></td></tr>`; }).join('') : '<tr><td colspan="6" class="muted">No completed orders in this period.</td></tr>'}
  </tbody></table></div></div>
  <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px">
    <div><h3 style="margin-bottom:8px">Deliveries by driver</h3><div class="tbl"><table><thead><tr><th>Driver</th><th class="num">Deliveries</th><th class="num">Order value</th></tr></thead><tbody>${byDrv.length ? byDrv.map(x => `<tr><td>${esc(x.d.name)}</td><td class="num">${x.list.length}</td><td class="num">${money(sum(x.list, 'total'))}</td></tr>`).join('') : '<tr><td colspan="3" class="muted">None yet.</td></tr>'}</tbody></table></div></div>
    <div><h3 style="margin-bottom:8px">Deals used</h3><div class="tbl"><table><thead><tr><th>Deal</th><th class="num">Uses</th><th class="num">Customers saved</th></tr></thead><tbody>${Object.keys(byDeal).length ? Object.entries(byDeal).sort((a, b) => b[1].n - a[1].n).map(([c, r]) => `<tr><td>${esc(c)}</td><td class="num">${r.n}</td><td class="num">${money(r.sv)}</td></tr>`).join('') : '<tr><td colspan="3" class="muted">No deals used.</td></tr>'}</tbody></table></div></div>
  </div>
  <div class="panel stack"><div class="row"><h3>Export</h3><span class="spacer"></span><button class="btn sm" data-act="csv">${ui.csv ? 'Hide' : 'Show'} CSV</button>${ui.csv ? '<button class="btn sm primary" data-act="copycsv">Copy</button>' : ''}</div>
    ${ui.csv ? `<textarea class="csv" id="csvbox" readonly>${esc(csv(done))}</textarea><p class="muted small">Paste into Excel or Google Sheets.</p>` : '<p class="muted small">Every completed order in this period, one row each.</p>'}</div>
  </div>`;
}
function dayStart() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function csv(list) {
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v;
  const rows = [['order','date','time','customer','address','items','subtotal','delivery_fee','discount','deal','total','driver','eta_min']];
  list.forEach(o => rows.push([o.no, dayKey(o.at), hhmm(o.at), o.customer.name, o.customer.address, o.items.map(i => i.qty + 'x ' + i.name + (i.contents ? ' (' + i.contents + ')' : '')).join('; '), o.sub.toFixed(2), o.fee.toFixed(2), o.disc.toFixed(2), o.deal || '', o.total.toFixed(2), driver(o.driverId)?.name || '', o.etaMin || '']));
  return rows.map(r => r.map(q).join(',')).join('\n');
}

    <section class="stack"><h2>New tickets ${offers.length ? `<span class="pill s-sent">${offers.length}</span>` : ''}</h2>

      <div class="row"><span class="t-no">#${o.no}</span><span class="muted small">sent ${ago(o.history.filter(x => x.s === 'sent').pop()?.at || o.at)}</span><span class="spacer"></span><span class="cash">Collect <span class="mono">${money(o.total)}</span></span></div>
      <div><strong>${esc(o.customer.address)}</strong><div class="muted small">${esc(o.customer.name)} · ${itemCount(o)} items</div></div>
      ${o.driverNote ? `<div class="small">Shop note: “${esc(o.driverNote)}”</div>` : ''}${o.customer.note ? `<div class="small muted">Customer: “${esc(o.customer.note)}”</div>` : ''}
      <fieldset style="border:0;padding:0;margin:0" class="stack"><legend class="eyebrow" style="margin-bottom:8px">Your ETA in minutes</legend>
        <div class="etas">${[10, 15, 20, 30, 45].map((m, i) => `<label><input type="radio" id="eta-${o.id}-${m}" name="eta" value="${m}" ${i === 2 ? 'checked' : ''}><span>${m}</span></label>`).join('')}
        <input id="etac-${o.id}" name="custom" type="number" min="1" max="240" placeholder="Other" style="width:90px" aria-label="Other ETA in minutes"></div></fieldset>
      <div class="row"><button class="btn primary">Accept ticket</button><button type="button" class="btn danger" data-act="decline" data-id="${o.id}">Decline</button></div>
    </form>`).join('') : `<div class="empty">No new tickets. You'll get a notification when the shop sends one.</div>`}</section>

    <section class="stack"><h2>Active</h2>
    ${active.length ? active.map(o => `<div class="panel stack job">
      <div class="row"><span class="t-no">#${o.no}</span>${pill(o.status)}<span class="spacer"></span><span class="small">ETA <span class="mono" data-eta="${o.id}">${etaText(o)}</span></span></div>
      <div><strong>${esc(o.customer.address)}</strong><div class="muted small">${esc(o.customer.name)} · <span class="mono">${esc(o.customer.phone)}</span></div></div>
      <div><span class="cash">Collect <span class="mono">${money(o.total)}</span> cash</span></div>
      <div class="small">${o.items.map(i => `${i.qty}× ${esc(i.name)}${i.contents ? ' (' + esc(i.contents) + ')' : ''}`).join(' · ')}</div>
      <div class="row"><a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(/london/i.test(o.customer.address) ? o.customer.address : o.customer.address + ', London')}" target="_blank" rel="noopener">${ICON.pin} Open in Maps</a>
        ${o.status === 'accepted' ? `<button class="btn" data-act="setstatus" data-v="picked" data-id="${o.id}">Picked up</button>` : ''}
        <button class="btn ok" data-act="setstatus" data-v="delivered" data-id="${o.id}">Delivered</button></div>
      <div><div class="eyebrow" style="margin-bottom:6px">Messages with the shop</div>${vThread(o, 'driver', 'driver')}</div>
    </div>`).join('') : '<div class="empty">No active deliveries.</div>'}</section>

    ${today.length ? `<section class="stack"><h2>Completed today</h2><p class="small">Cash collected today: <strong class="mono">${money(today.reduce((a, o) => a + o.total, 0))}</strong></p><div class="tbl"><table><tbody>${today.map(o => `<tr><td class="mono">#${o.no}</td><td style="white-space:normal">${esc(o.customer.address)}</td><td class="num">${money(o.total)}</td><td class="num">${hhmm(o.history.filter(h => h.s === 'delivered').pop().at)}</td></tr>`).join('')}</tbody></table></div></section>` : ''}

}

/* ---------- actions ---------- */
function setStatus(o, s, by) {
  o.status = s; o.history.push({s, at:now(), by});
  const d = driver(o.driverId);
  if (s === 'picked') notify('order:' + o.id, `Your order #${o.no} is on the way`, o.id);
  if (s === 'delivered') {
    notify('order:' + o.id, `Order #${o.no} delivered. Enjoy your food!`, o.id);
    if (L.role !== 'mod') notify('mod', `#${o.no} delivered${d ? ' by ' + d.name : ''}`, o.id);
    if (L.role !== 'driver' && d) notify('driver:' + d.id, `#${o.no} marked completed by the shop`, o.id);
  }
}

const ACT = {
  role: t => { L.role = t.dataset.v; ui.showNotes = false; ui.open = null; saveLocal(); },
  bell: () => { ui.showNotes = !ui.showNotes; if (!ui.showNotes) return; setTimeout(() => { L.read[audKey()] = now(); saveLocal(); render(); }, 1200); },
  note: t => { ui.showNotes = false; L.read[audKey()] = now(); saveLocal(); const id = t.dataset.id; if (!id || !order(id)) return; if (L.role === 'mod') { ui.open = id; ui.thread = 'customer'; } if (L.role === 'customer') { ui.cv = 'track'; ui.trackId = id; } },
  noop: () => false,
  // customer
  inc: t => { ui.cart[t.dataset.id] = (ui.cart[t.dataset.id] || 0) + 1; },
  dec: t => { ui.cart[t.dataset.id] = Math.max(0, (ui.cart[t.dataset.id] || 0) - 1); },
  basket: () => { ui.cv = 'basket'; },
  menu: () => { ui.cv = 'menu'; ui.trackId = null; },
  myorders: () => { ui.cv = 'past'; },
  track: t => { ui.cv = 'track'; ui.trackId = t.dataset.id; window.scrollTo(0, 0); },
  cat: t => { document.getElementById('cat-' + t.dataset.v.replace(/\W/g, ''))?.scrollIntoView({behavior:'smooth', block:'start'}); return false; },
  dropcode: () => { ui.code = null; },
  // moderator
  modtab: t => { ui.modTab = t.dataset.v; ui.csv = false; },
  filter: t => { ui.filter = t.dataset.v; },
  open: t => { ui.open = t.dataset.id; ui.thread = 'customer'; ui.confirmCancel = false; },
  close: () => { ui.open = null; },
  thread: t => { ui.thread = t.dataset.v; },
  reassign: t => { const o = order(t.dataset.id); const d = driver(o.driverId); if (d) notify('driver:' + d.id, `Ticket #${o.no} was taken back by the shop`, o.id); o.driverId = null; setStatus(o, 'new', 'Reassigned'); },
  askcancel: () => { ui.confirmCancel = true; },
  nocancel: () => { ui.confirmCancel = false; },
  cancel: t => { const o = order(t.dataset.id); setStatus(o, 'cancelled'); notify('order:' + o.id, `Order #${o.no} was cancelled by the shop`, o.id); if (o.driverId) notify('driver:' + o.driverId, `#${o.no} was cancelled`, o.id); ui.confirmCancel = false; },
  setstatus: t => { const o = order(t.dataset.id); setStatus(o, t.dataset.v, L.role === 'driver' ? driver(o.driverId)?.name : 'Shop'); },
  menutoggle: t => { const m = S.menu.find(x => x.id === t.dataset.id); m.on = !m.on; },
  menudel: t => { S.menu = S.menu.filter(x => x.id !== t.dataset.id); },
  dealtoggle: t => { const d = S.deals.find(x => x.id === t.dataset.id); d.active = !d.active; if (d.active && d.expires && d.expires < now()) d.expires = null; },
  dealkind: t => { ui.dealKind = t.dataset.v; },
  dealdel: t => { S.deals = S.deals.filter(x => x.id !== t.dataset.id); },
  drvtoggle: t => { const d = driver(t.dataset.id); d.on = !d.on; },
  viewas: t => { L.driverId = t.dataset.id; L.role = 'driver'; saveLocal(); },
  acct: t => { ui.acct = t.dataset.v; },
  csv: () => { ui.csv = !ui.csv; },
  copycsv: () => { const box = document.getElementById('csvbox'); const txt = box.value; navigator.clipboard?.writeText(txt).then(() => toast('CSV copied', 'Export')).catch(() => { box.focus(); box.select(); toast('Press copy on your keyboard or menu', 'Selected'); }); return false; },
  openshop: () => { S.settings.open = !S.settings.open; },
  askreset: () => { ui.confirmReset = true; },
  noreset: () => { ui.confirmReset = false; },
  reset: () => { S = seed(); seen = new Set(S.notes.map(n => n.id)); L.myOrders = []; L.read = {}; saveLocal(); ui.confirmReset = false; ui.cart = {}; ui.code = null; toast('Demo data reset', 'Settings'); },
  // driver
  decline: t => { const o = order(t.dataset.id); const d = driver(o.driverId); o.driverId = null; setStatus(o, 'new', 'Declined by ' + (d?.name || 'driver')); notify('mod', `${d?.name || 'Driver'} declined #${o.no}. Send it to someone else.`, o.id); },
};
const READONLY = new Set(['role','bell','note','noop','inc','dec','basket','menu','myorders','track','cat','dropcode','dealkind','modtab','filter','open','close','thread','askcancel','nocancel','acct','csv','copycsv','askreset','noreset','viewas']);

const FORM = {
  code: f => { const c = f.code.value.trim().toUpperCase(); const d = S.deals.find(x => x.kind === 'code' && x.code === c); if (!c) return; if (!d || !dealLive(d)) { ui.codeErr = `"${c}" isn't a live code.`; } else { ui.code = c; ui.codeErr = ''; clearIds.push('promo'); } return false; },
  checkout: f => {
    const items = cartItems(); if (!items.length || !S.settings.open) return false;
    const c = {name:f.name.value.trim(), phone:f.phone.value.trim(), address:f.address.value.trim(), note:f.note.value.trim()};
    if (!c.name || !c.phone || !c.address) { ui.checkoutErr = 'Add your name, phone number and address so the driver can find you.'; return false; }
    const o = buildOrder(S, c, items, ui.code, now());
    S.orders.push(o); L.myOrders.push(o.id); saveLocal();
    notify('mod', `New order #${o.no} from ${c.name} · ${money(o.total)}`, o.id);
    notify('order:' + o.id, `Order #${o.no} received. We'll update you here.`, o.id);
    ui.cart = {}; ui.code = null; ui.checkoutErr = ''; ui.cv = 'track'; ui.trackId = o.id;
    clearIds.push('c-note'); window.scrollTo(0, 0);
    toast(`Order #${o.no} placed`, 'Thank you');
  },
  msg: f => {
    const text = f.t.value.trim(); if (!text) return false;
    const o = order(f.dataset.id), th = f.dataset.thread, from = f.dataset.from;
    o.threads[th].push({from, text, at:now()});
    const short = text.length > 60 ? text.slice(0, 57) + '…' : text;
    if (from === 'shop') notify(th === 'customer' ? 'order:' + o.id : 'driver:' + o.driverId, `${S.settings.shop} on #${o.no}: ${short}`, o.id);
    else notify('mod', `${from === 'customer' ? o.customer.name : driver(o.driverId)?.name} on #${o.no}: ${short}`, o.id);
    clearIds.push(f.t.id);
  },
  dispatch: f => {
    const o = order(f.dataset.id), d = driver(f.driver.value); if (!d) return false;
    o.driverId = d.id; o.driverNote = f.note.value.trim(); setStatus(o, 'sent', 'to ' + d.name);
    notify('driver:' + d.id, `New ticket #${o.no} · ${o.customer.address}`, o.id);
    notify('order:' + o.id, `Your order #${o.no} is being prepared`, o.id);
    toast(`Ticket #${o.no} sent to ${d.name}`, 'Dispatched');
  },
  accept: f => {
    const o = order(f.dataset.id); const m = parseInt(f.custom.value, 10) || parseInt(f.querySelector('input[name=eta]:checked')?.value, 10) || 20;
    o.etaMin = m; o.eta = now() + m * MIN; const d = driver(o.driverId);
    setStatus(o, 'accepted', d?.name);
    notify('mod', `${d?.name} accepted #${o.no} · ETA ${m} min`, o.id);
    notify('order:' + o.id, `${d?.name} is your driver. Arriving around ${hhmm(o.eta)}`, o.id);
  },
  menuadd: f => { S.menu.push({id:uid('m'), name:f.name.value.trim(), cat:f.cat.value.trim() || 'Other', price:+f.price.value || 0, desc:f.desc.value.trim(), on:true}); clearIds.push('ma-name', 'ma-price', 'ma-desc'); },
  dealadd: f => {
    const k = ui.dealKind, hrs = +f.exp.value, base = {id:uid('dl'), kind:k, active:true, expires:hrs > 0 ? now() + hrs * HOUR : null};
    if (k === 'bundle') {
      const items = S.menu.map(m => ({id:m.id, qty:parseInt(f['q_' + m.id].value, 10) || 0})).filter(x => x.qty > 0);
      const name = f.name.value.trim(), price = +f.price.value;
      if (!name || !(price > 0) || !items.length) { toast('Give the meal deal a name, a price and at least one item.', 'Deals'); return false; }
      S.deals.unshift({...base, name, price, items}); clearIds.push('da-name', 'da-price', ...S.menu.map(m => 'bq-' + m.id));
    } else {
      const type = f.type.value, value = +f.value.value || 0, min = +f.min.value || 0;
      if (type !== 'freedelivery' && !(value > 0)) { toast('Enter how much the deal takes off.', 'Deals'); return false; }
      if (k === 'spend') {
        if (!(min > 0)) { toast('Enter how much customers need to spend.', 'Deals'); return false; }
        S.deals.unshift({...base, type, value, min});
      } else {
        const code = f.code.value.trim().toUpperCase().replace(/\s+/g, '');
        if (!code) { toast('Enter a code for customers to type.', 'Deals'); return false; }
        if (S.deals.some(d => d.code === code)) { toast(`${code} already exists. Pick another code.`, 'Deals'); return false; }
        S.deals.unshift({...base, code, type, value, min}); clearIds.push('da-code');
      }
      clearIds.push('da-val', 'da-min');
    }
    clearIds.push('da-exp'); toast('Deal is live. Customers can see it now.', 'Deals');
  },
  drvadd: f => { S.drivers.push({id:uid('dr'), name:f.name.value.trim(), phone:f.phone.value.trim(), on:true}); clearIds.push('dra-name', 'dra-phone'); },
  settings: f => { Object.assign(S.settings, {shop:f.shop.value.trim() || 'Red Line', deliveryFee:+f.deliveryFee.value || 0}); toast('Settings saved', 'Settings'); },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) { if (ui.showNotes && !e.target.closest('.notes')) { ui.showNotes = false; render(); } return; }
  const a = t.dataset.act; if (!ACT[a] || a === 'noop') return;
  if (t.tagName === 'A') return;
  e.preventDefault();
  if (a !== 'bell' && a !== 'note') ui.showNotes = false;
  const r = ACT[a](t);
  if (!READONLY.has(a)) save();
  if (r !== false) render();
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); } if (e.key === 'Escape' && (ui.open || ui.cv === 'basket')) { ui.open = null; if (ui.cv === 'basket') ui.cv = 'menu'; render(); } });
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const r = FORM[f.dataset.form](f);
  if (f.dataset.form !== 'code') save();
  if (r !== false || f.dataset.form === 'code' || f.dataset.form === 'checkout') render();
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-change]'); if (!t) return;
  if (t.dataset.change === 'price') { const m = S.menu.find(x => x.id === t.dataset.id); if (m) { m.price = Math.max(0, +t.value || 0); save(); } }
  if (t.dataset.change === 'driveras') { L.driverId = t.value; saveLocal(); render(); }
});

// keep times and ETAs fresh without disturbing typing
setInterval(() => {
  document.querySelectorAll('[data-ago]').forEach(el => el.textContent = ago(+el.dataset.ago));
  document.querySelectorAll('[data-eta]').forEach(el => { const o = order(el.dataset.eta); if (o) el.textContent = etaText(o); });
}, 20000);

save(); render();
})();
</script>
